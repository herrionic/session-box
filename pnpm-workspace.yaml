packages:
  - apps/*
  - packages/*
  - plugins/*

# pnpm >=10 blocks dependency build scripts by default.
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - vitest@5.0.3
  - '@fastify/websocket@11.3.2'
  - '@earendil-works/chord@1.0.2'
  - '@earendil-works/pi-agent-core@1.0.2'
  - '@earendil-works/pi-ai@1.0.2'
  - '@earendil-works/pi-codemode@1.0.2'
  - '@earendil-works/pi-coding-agent@1.0.2'
  - '@earendil-works/pi-mcp@1.0.2'
  - '@earendil-works/pi-telemetry@1.0.2'
  - '@earendil-works/pi-tui@1.0.2'

onlyBuiltDependencies:
  - esbuild

# Do not fail the install when optional native build scripts are skipped.
strictDepBuilds: false

# Native/optional build scripts we deliberately skip. ssh2 falls back to its
# pure-JS crypto implementation, which is fine for the MVP.
ignoredBuiltDependencies:
  - cpu-features
  - protobufjs
  - ssh2
