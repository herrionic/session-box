# SessionBox container sshd policy.
# Authentication is key-only; the key is injected by the SessionBox server.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
UsePAM no
AllowUsers agent

PrintMotd no
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding yes

MaxAuthTries 6
ClientAliveInterval 30
ClientAliveCountMax 6

# NOTE: no `Subsystem sftp` override here — Debian's default sshd_config already
# defines it, and defining it twice makes sshd refuse to start.
